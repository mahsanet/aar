name: Build Psiphon AAR

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Repository to clone and build
        required: true
        default: shirokhorshid/psiphon-tunnel-core
      target_ref:
        description: Branch, tag, or commit to check out in the target repository
        required: true
        default: 2026.05.24
      release_tag:
        description: Release tag to create or update. Leave blank to auto-generate one.
        required: false
        default: ""
      release_name:
        description: Release name. Leave blank to auto-generate one.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-aar:
    name: Build and release AAR
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GOMOBILE_REPOSITORY: https://github.com/mahsanet/gomobile
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REF: ${{ inputs.target_ref }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      ANDROID_NDK_VERSION: r29
      OUTPUT_AAR: libpsiphon.aar
      GO_PACKAGE: github.com/Psiphon-Labs/psiphon-tunnel-core/MobileLibrary/psi

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          link-to-sdk: true

      - name: Export Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "${GITHUB_ENV}"

      - name: Install gomobile fork
        run: |
          git clone --depth 1 "${GOMOBILE_REPOSITORY}" "${RUNNER_TEMP}/gomobile"
          cd "${RUNNER_TEMP}/gomobile"
          go_bin="$(go env GOPATH)/bin"
          echo "${go_bin}" >> "${GITHUB_PATH}"
          go install ./cmd/gomobile

      - name: Clone target repository
        run: |
          git init "${RUNNER_TEMP}/target"
          cd "${RUNNER_TEMP}/target"
          git remote add origin "https://github.com/${TARGET_REPOSITORY}.git"
          git fetch --depth 1 origin "${TARGET_REF}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD

      - name: Build AAR
        env:
          GOTOOLCHAIN: go1.24.13
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cd "${RUNNER_TEMP}/target"
          BUILDDATE="$(date --iso-8601=seconds)"
          BUILDREV="$(git rev-parse --short HEAD)"
          GO_VER="$(go version | perl -ne '/go version (.*?) / && print $1')"
          LDFLAGS="\
          -checklinkname=0 \
          -s \
          -w \
          -X github.com/Psiphon-Labs/psiphon-tunnel-core/psiphon/common/buildinfo.buildDate=${BUILDDATE} \
          -X github.com/Psiphon-Labs/psiphon-tunnel-core/psiphon/common/buildinfo.buildRev=${BUILDREV} \
          -X github.com/Psiphon-Labs/psiphon-tunnel-core/psiphon/common/buildinfo.goVersion=${GO_VER} \
          -extldflags=-Wl,-z,max-page-size=16384,-z,common-page-size=16384 \
          "
          gomobile bind \
            -target=android/arm,android/arm64,android/386,android/amd64 \
            -tags="PSIPHON_ENABLE_INPROXY" \
            -ldflags="${LDFLAGS}" \
            -androidapi 21 \
            -soname psiphon \
            -o "${GITHUB_WORKSPACE}/dist/${OUTPUT_AAR}" \
            "${GO_PACKAGE}"
          ls -lh "${GITHUB_WORKSPACE}/dist/${OUTPUT_AAR}"

      - name: Prepare release metadata
        run: |
          ref_slug="$(printf '%s' "${TARGET_REF}" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//; s/-$//')"
          release_date="$(date -u +%F)"
          release_tag="${RELEASE_TAG_INPUT:-psiphon-${ref_slug}-${release_date}}"
          release_name="${RELEASE_NAME_INPUT:-Psiphon AAR ${ref_slug} ${release_date}}"
          {
            echo "RELEASE_TAG=${release_tag}"
            echo "RELEASE_NAME=${release_name}"
          } >> "${GITHUB_ENV}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: libpsiphon-aar
          path: dist/libpsiphon.aar
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "dist/${OUTPUT_AAR}" --clobber
          else
            gh release create "${RELEASE_TAG}" "dist/${OUTPUT_AAR}" \
              --title "${RELEASE_NAME}" \
              --notes "Built ${OUTPUT_AAR} from ${TARGET_REPOSITORY}@${TARGET_REF} using ${GOMOBILE_REPOSITORY}."
          fi
